[package]
name = "afix-encoder"
version = "1.0.0"
edition = "2021"
description = "Yaka-Core encoder — converts JPEG/PNG images into .aFix format"
license = "MIT"

[dependencies]
libafix = { path = "../libafix" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
